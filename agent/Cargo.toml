[package]
name = "polyp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "polyp"
path = "src/main.rs"

[[bin]]
name = "anemone-mock"
path = "src/bin/anemone-mock.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
hostname = "0.4.2"
http = "1.5.0"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "signal", "io-util", "net", "time", "sync", "fs", "io-std"] }
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3.27.0"
