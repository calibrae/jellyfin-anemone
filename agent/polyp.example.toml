# polyp example config. Copy to /etc/polyp.toml (or point --config elsewhere) and edit.
#
# Any of these keys may also be set (or overridden) with matching CLI flags,
# e.g. `polyp --config /etc/polyp.toml --max-sessions 4`. CLI flags win.

# Control WebSocket URL of the Jellyfin cluster plugin. Required (here or via --server-url).
server_url = "ws://10.240.0.1:8097/Anemone/agents/ws"

# Shared secret, sent as `Authorization: Bearer <secret>`. Required (here or via --secret).
# Pull this from Vault (infra/anemone) rather than committing it.
secret = "CHANGE-ME"

# Name reported in the `hello` frame. Defaults to this machine's short hostname if omitted.
# name = "trish"

# Path to the jellyfin-ffmpeg binary. Defaults to "ffmpeg" (resolved via PATH) if omitted.
# Official portable builds: https://github.com/jellyfin/jellyfin-ffmpeg/releases
ffmpeg = "/opt/anemone/ffmpeg"

# Maximum concurrent transcode sessions. Defaults to 3.
max_sessions = 3

# Paths that must be readable for this agent to accept jobs that read from them (e.g. an SMB
# mount shared with the Jellyfin server). A bad/missing mount is reported, not fatal.
#
# Bare strings mean the path is identical on this agent and on the Jellyfin server:
mounts = ["/Volumes/data"]
#
# When the tree lives at a different path on this agent than what Jellyfin calls it (e.g. this
# agent NFS-mounts the same media tree at a different path than the server's SMB mount), use the
# table form instead -- `server_path` is what the server calls it, and defaults to `path` if
# omitted. The two forms can be mixed in one `mounts` list.
# [[mounts]]
# path = "/mnt/media"           # where the tree lives on THIS agent
# server_path = "/Volumes/data" # what the Jellyfin server calls the same tree

# Hardware-acceleration profile this agent's ffmpeg jobs should be built for:
# videotoolbox, nvenc, qsv, vaapi, amf, rkmpp, or none (software only, e.g. libx264).
# Auto-detected when omitted (from ffmpeg's -hwaccels plus the local machine's hardware);
# "none" is a valid, useful answer -- a fast CPU with no usable GPU still helps.
# hwaccel = "vaapi"

# Device the hwaccel profile needs, e.g. /dev/dri/renderD128 for vaapi/qsv on Linux. Defaults to
# the auto-detected render node when applicable (unset for videotoolbox/nvenc/none).
# hwaccel_device = "/dev/dri/renderD128"

# trace, debug, info, warn, error. Defaults to "info". RUST_LOG overrides this if set.
log_level = "info"
