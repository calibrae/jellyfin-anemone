# polyp example config. Copy to /etc/polyp.toml (or point --config elsewhere) and edit.
#
# Any of these keys may also be set (or overridden) with matching CLI flags,
# e.g. `polyp --config /etc/polyp.toml --max-sessions 4`. CLI flags win.

# Control WebSocket URL of the Jellyfin cluster plugin. Required (here or via --server-url).
server_url = "ws://10.240.0.1:8096/Anemone/agents/ws"

# Shared secret, sent as `Authorization: Bearer <secret>`. Required (here or via --secret).
# Pull this from Vault (infra/anemone) rather than committing it.
secret = "CHANGE-ME"

# Name reported in the `hello` frame. Defaults to this machine's short hostname if omitted.
# name = "trish"

# Path to the jellyfin-ffmpeg binary. Defaults to "ffmpeg" (resolved via PATH) if omitted.
# Official portable builds: https://github.com/jellyfin/jellyfin-ffmpeg/releases
ffmpeg = "/opt/anemone/ffmpeg"

# Maximum concurrent transcode sessions. Defaults to 3.
max_sessions = 3

# Paths that must be readable for this agent to accept jobs that read from them (e.g. an SMB
# mount shared with the Jellyfin server). A bad/missing mount is reported, not fatal.
mounts = ["/Volumes/data"]

# trace, debug, info, warn, error. Defaults to "info". RUST_LOG overrides this if set.
log_level = "info"
